<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
			crossorigin="anonymous"
			referrerpolicy="no-referrer" />
		<link href="https://fonts.cdnfonts.com/css/camelin" rel="stylesheet" />

		<link rel="stylesheet" href="./css/default.css" />
		<link rel="stylesheet" href="./css/styles.css" />
		<link rel="stylesheet" href="./css/responsive.css" />
		<link rel="stylesheet" href="./css/animation.css" />

		<script src="./js.js" defer></script>
		<title>CALCODEZ</title>
	</head>
	<body>
		<header class="hero-section container">
			<!-- ++Mobile Menu -->
			<i id="mobile-menu-toggle" class="fa-solid fa-bars mobile-menu-toggle"></i>
			<nav id="mobile-menu" class="mobile-menu container">
				<a class="mobile-nav-links" href="#">About</a>
				<a class="mobile-nav-links" href="#project-section">Projects</a>
				<a class="mobile-nav-links" href="#">Contact</a>
			</nav>
			<!-- !!Image/ Slogan  -->
			<div class="profile-img-slogan-wrapper container">
				<div class="profile-img-container container">
					<img src="./assets/images/CalvinC_One.jpg" alt="Calvin Colbert" />
				</div>
				<div class="slogan-container container">
					<h4>Wed Dev Cal</h4>
				</div>
			</div>

			<!-- !!Logo Contact -->

			<div class="logo-nav-wrapper container">
				<div class="logo-container container">
					<h1 id="logo-text">CalCodez</h1>
				</div>
				<nav class="nav-container container">
					<a href="#">About</a>
					<a href="#project-section">Projects</a>
					<a id="contact-cta-btn" class="contact-cta-btn" href="#">Contact</a>
				</nav>

				<div id="contact-container" class="contact-container container">
					<i id="contact-close-x" class="fa-solid fa-x"></i>
					<h3 id="direct-contact-label" class="contact-label">Contact Me</h3>
					<div class="contact-icons-container container">
						<a class="contact-link" href="#"><i class="fa-brands fa-google"></i></a>
						<a class="contact-link" href="#"><i class="fa-brands fa-whatsapp"></i></a>
					</div>
					<h3 id="social-contact-label" class="contact-label">Find Me On</h3>

					<div class="social-icons-container container">
						<a class="contact-link" href="#"><i class="fa-brands fa-facebook"></i></a>
						<a class="contact-link" href="#"><i class="fa-brands fa-instagram"></i></a>
						<a class="contact-link" href="#"><i class="fa-brands fa-threads"></i></a>
					</div>
				</div>
			</div>
		</header>

		<!-- !!Coding Badge Container (Js Generated) -->
		<section id="coding-badge-container" class="coding-badge-container container"></section>

		<!-- !!Projects Section -->

		<section id="project-section" class="project-section container">
			<h2 class="project-header">Projects</h2>

			<div id="project-cards-container" class="project-cards-container container">
				<div class="project-card container">
					<div class="card-img-container">
						<img src="./assets/images/CalvinC_One.jpg" alt="placeholder" />
					</div>

					<h3 class="project-name">Project Name</h3>

					<div class="card-btn-container container">
						<a href="#">Info</a>
						<a href="#">View</a>
					</div>
				</div>
			</div>
		</section>
	</body>
</html>
