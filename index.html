<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
			integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer" />
		<link href="https://fonts.cdnfonts.com/css/camelin" rel="stylesheet" />

		<link rel="stylesheet" href="./css/default.css" />
		<link rel="stylesheet" href="./css/styles.css" />
		<link rel="stylesheet" href="./css/responsive.css" />
		<link rel="stylesheet" href="./css/animation.css" />

		<script src="./js.js" defer></script>
		<title>CALCODEZ</title>
	</head>
	<body>
		<header class="hero-section container">
			<!-- ++Mobile Menu -->
			<i id="mobile-menu-toggle" class="fa-solid fa-bars mobile-menu-toggle"></i>
			<nav id="mobile-menu" class="mobile-menu container">
				<a class="mobile-nav-links" href="#">About</a>
				<a class="mobile-nav-links" href="#">Projects</a>
				<a class="mobile-nav-links" href="#">Contact</a>
			</nav>
			<!-- !!Image/ Slogan  -->
			<div class="profile-img-slogan-wrapper container">
				<div class="profile-img-container container">
					<img src="./assets/images/CalvinC_One.jpg" alt="Calvin Colbert" />
				</div>
				<div class="slogan-container container"><q>Calvin Colbert</q></div>
			</div>

			<!-- !!Logo Contact -->

			<div class="logo-nav-wrapper container">
				<div class="logo-container container">
					<h1 id="logo-text">CalCodez</h1>
				</div>
				<nav class="nav-container container">
					<a href="#">About</a>
					<a href="#">Projects</a>
					<a href="#">Contact</a>
				</nav>
			</div>
		</header>

		<section class="skills-section container">
			<h2 id="coding-label" class="skills-header">Skills</h2>
			<div class="icon-container container">
				<div class="coding-icons-container container">
					<i class="fa-brands fa-html5"></i>
					<i class="fa-brands fa-css3-alt"></i>
					<i class="fa-brands fa-js"></i>
					<i class="fa-brands fa-github"></i>
				</div>
			</div>
		</section>
	</body>
</html>
